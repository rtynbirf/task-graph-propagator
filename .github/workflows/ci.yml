name: CI


permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Ядро самоверифицируется ассертами
        run: |
          python3 propagator_engine.py
          python3 propagator_engine_part2.py
      - name: П53 · property-тесты (stdlib random, seed 20261109 — детерминированные)
        run: |
          python3 test_propagator_properties.py
          python3 test_propagator_properties.py > /tmp/run2.txt
          python3 test_propagator_properties.py | diff - /tmp/run2.txt && echo "двойной прогон идентичен"
